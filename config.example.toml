# Пример конфига git-xfer.
# Рабочее место: ~/.config/git-xfer/config.toml (учитывается XDG_CONFIG_HOME).
# Создать шаблон на месте: git-xfer init
#
# Профиль — это ПАРА репозиториев, а не направление. Направление выбирается
# в момент вызова: `--to b` тащит из a в b, `--to a` — обратно, без флага
# в терминале спросит. Поэтому на пару нужен один профиль, а не два.

[defaults]
# Сколько коммитов источника показывать. Разово — флагом --limit.
scan_limit = 30

# Как глубоко читать целевую историю в поисках трейлера
# (cherry picked from commit ...). Самый надёжный канал дедупликации:
# окно определяет, на сколько своих коммитов назад утилита помнит,
# что уже переносила. Читается быстро, уменьшать смысла нет.
dedup_window = 5000

# Окно сравнения по patch-id — эвристика для пометки ~.
# Дороже, но результат кэшируется в state.
patchid_window = 1000

# Журнал прогонов: что запускалось, с каким кодом и где встало.
# Лежит рядом со state, вне рабочих репозиториев, в git не попадает.
# Посмотреть путь: git-xfer status
log = true
# log_file = "~/.local/state/git-xfer/git-xfer.log"

[profiles.myproj]
a = "/path/to/repo-a"
b = "/path/to/repo-b"
branch = "master"            # одна ветка с обеих сторон

[profiles.myproj-release]    # та же пара, другие ветки
a = "/path/to/repo-a"
b = "/path/to/repo-b"
a_branch = "release/1.x"     # если ветки называются по-разному
b_branch = "stable"
# Значения из [defaults] можно переопределить внутри профиля:
# scan_limit = 100
# dedup_window = 2000
# patchid_window = 500

# Разовую ветку описывать профилем не нужно — есть флаги:
#   git-xfer list -p myproj --to b -b feature/login
#   git-xfer list --source ~/dev/repo-a --target ~/dev/repo-b -b master
#   git-xfer apply --ask
