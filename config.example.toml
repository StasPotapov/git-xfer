# Пример конфига git-xfer.
# Рабочее место: ~/.config/git-xfer/config.toml (учитывается XDG_CONFIG_HOME).
# Создать шаблон на месте: git xfer init

[defaults]
# Сколько коммитов источника показывать. Разово — флагом --limit.
scan_limit = 30

# Как глубоко читать целевую историю в поисках трейлера
# (cherry picked from commit ...). Самый надёжный канал: окно определяет,
# на сколько своих коммитов назад утилита помнит, что уже переносила.
# Читается быстро, уменьшать смысла нет.
dedup_window = 5000

# Окно сравнения по patch-id — эвристика для пометки ≈.
# Дороже, но результат кэшируется.
patchid_window = 1000

# Профиль = одно направление переноса. Обратное направление — отдельный
# профиль с зеркальными source/target.

[profiles.a2b]
source = "/path/to/repo-a"
source_branch = "master"
target = "/path/to/repo-b"
target_branch = "master"

[profiles.b2a]
source = "/path/to/repo-b"
source_branch = "master"
target = "/path/to/repo-a"
target_branch = "master"
# Значения из [defaults] можно переопределить внутри профиля:
# scan_limit = 100
# dedup_window = 5000
# patchid_window = 500
